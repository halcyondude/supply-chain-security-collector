# Re-collects the CNCF landscape dataset from the GitHub GraphQL API, runs the
# SQL models, builds the graph, and publishes the result:
#   - always: the full output (DuckDB, Parquet, graph) as a workflow artifact
#   - on dispatch/schedule: the explorer snapshot (site/public/data) and the
#     refreshed landscape input pushed to a data/collection-<date> branch, ready
#     for a PR. Nothing is pushed to main.
#
# Token: COLLECTOR_TOKEN (read-only PAT, 5,000 pts/h) if set, else GITHUB_TOKEN
# (1,000 pts/h). One repo costs ~1 point, so either covers a full run.
# GITHUB_TOKEN can't read other repos' branch protection rules; the collector
# retries those repos without them, so base_branch_protection_rules is empty
# unless COLLECTOR_TOKEN is set. --min-success-rate stops a mostly failed run
# from publishing.
name: Collect landscape data
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * 1' # Mondays 06:17 UTC

permissions:
  contents: read

concurrency:
  group: collect
  cancel-in-progress: false

env:
  INPUT: input/cncf-full-landscape.json
  OUTPUT_DIR: output/cncf-full-landscape/current

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: package.json
          cache: npm
      - run: npm ci
      - name: Refresh landscape input
        run: npm run fetch:landscape
      - name: Collect and analyze
        env:
          GITHUB_PERSONAL_ACCESS_TOKEN: ${{ secrets.COLLECTOR_TOKEN || github.token }}
        run: npx ts-node src/neo.ts --input "$INPUT" --queries GetRepoDataExtendedInfo --analyze --parallel --min-success-rate 0.9
      - name: Build graph
        run: npm run graph -- --database "$OUTPUT_DIR/database.db"
      - name: Export explorer snapshot
        run: npx ts-node site/scripts/export-base-db.ts --database "$OUTPUT_DIR/database.db" --output site/public/data
      - name: Summary
        run: |
          {
            echo "### Collection summary"
            echo '```'
            npm run --silent report -- --database "$OUTPUT_DIR/database.db" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: collection-${{ github.run_id }}
          path: |
            output/cncf-full-landscape/
            !output/**/files/
          retention-days: 30
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: explorer-snapshot-${{ github.run_id }}
          path: |
            site/public/data/
            input/cncf-full-landscape.json
          retention-days: 30

  publish:
    needs: collect
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: explorer-snapshot-${{ github.run_id }}
      - name: Push data branch
        run: |
          branch="data/collection-$(date -u +%Y-%m-%d)-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add site/public/data input/cncf-full-landscape.json
          git commit -m "data: landscape collection $(date -u +%Y-%m-%d) (run ${GITHUB_RUN_ID})"
          git push origin "$branch"
          echo "Pushed \`$branch\`" >> "$GITHUB_STEP_SUMMARY"
